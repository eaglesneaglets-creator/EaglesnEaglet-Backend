name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Lint, migrate, test
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_eaglesneaglets
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: local
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DEBUG: "True"
      DB_NAME: test_eaglesneaglets
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_eaglesneaglets
      FRONTEND_URL: http://localhost:5173
      SUPPORT_EMAIL: ci@example.com
      EMAIL_HOST: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Static analysis
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: pytest --tb=short -q --no-header

# Deployment is not done here. Railway deploys the API and worker straight
# from GitHub when `main` changes, and waits for this workflow to pass first
# ("Wait for CI"). A second deploy from CI duplicated that and, when it failed,
# made Railway skip the release.
