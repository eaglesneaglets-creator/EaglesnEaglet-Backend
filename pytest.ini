[pytest]
DJANGO_SETTINGS_MODULE = eaglesneagletsbackend.settings.test
# `tests_*.py` added 2026-07-30: the repo already contained four such files
# (tests_admin_eligibility, tests_mentor_app, tests_post_deploy_hardening,
# tests_avatar) holding 53 tests that were SILENTLY UNCOLLECTED — they passed when
# run by explicit path, so the gap looked like coverage. Do not remove this pattern.
python_files = tests.py test_*.py *_tests.py tests_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
# `core` added 2026-09-21: with `testpaths = apps` alone, everything under
# core/tests/ was SILENTLY UNCOLLECTED by a bare `pytest` (and therefore by CI) —
# the same failure mode as the tests_*.py gap above. Those tests passed when run
# by explicit path, which is why nobody noticed.
testpaths = apps core
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
