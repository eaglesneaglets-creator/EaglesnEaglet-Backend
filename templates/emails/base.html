{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>{% block title %}Eagles & Eaglets{% endblock %}</title>
    <style>
        /* Reset + base */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #0f172a;
            margin: 0;
            padding: 0;
            background-color: #f0fdf4;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }
        table { border-collapse: collapse; }
        a { color: #059669; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Outer wrapper for email clients */
        .wrapper {
            width: 100%;
            background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 60%);
            padding: 28px 16px 40px;
        }

        /* Card */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px -8px rgba(16, 185, 129, 0.18),
                        0 4px 12px -2px rgba(15, 23, 42, 0.06);
            border: 1px solid #d1fae5;
        }

        /* Header — emerald gradient matches login page */
        .header {
            background: linear-gradient(135deg, #10b981 0%, #059669 60%, #047857 100%);
            padding: 36px 32px 28px;
            text-align: center;
            position: relative;
        }
        .header-title {
            color: #ffffff;
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .header-tagline {
            color: rgba(255, 255, 255, 0.85);
            margin: 6px 0 0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .header-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fbbf24;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* Content body */
        .content {
            padding: 36px 36px 8px;
        }
        .content h2 {
            color: #0f172a;
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .content p {
            color: #475569;
            margin: 12px 0;
            font-size: 15px;
        }

        /* Pill button — matches Sign In button on login page */
        .button-wrapper {
            text-align: center;
            margin: 28px 0;
        }
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.01em;
            box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.4);
        }
        .button:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            text-decoration: none;
        }
        .button.secondary {
            background: #f1f5f9;
            color: #475569 !important;
            box-shadow: none;
        }

        /* Info / accent boxes */
        .info-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            padding: 16px 20px;
            margin: 20px 0;
        }
        .info-box p { margin: 0; color: #166534; font-size: 14px; }
        .info-box strong { color: #14532d; }

        .warning-box {
            background: #fef3c7;
            border: 1px solid #fde68a;
            border-radius: 14px;
            padding: 16px 20px;
            margin: 20px 0;
        }
        .warning-box p { margin: 0; color: #92400e; font-size: 14px; }

        .danger-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 14px;
            padding: 16px 20px;
            margin: 20px 0;
        }
        .danger-box p { margin: 0; color: #991b1b; font-size: 14px; }

        .note-box {
            background: #f8fafc;
            border-left: 3px solid #10b981;
            border-radius: 8px;
            padding: 14px 18px;
            margin: 20px 0;
        }
        .note-box p { margin: 0; color: #334155; font-size: 14px; font-style: italic; }
        .note-box-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        /* Divider */
        .divider {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin: 28px 0;
        }

        /* Fallback link block — shown when the button is unclickable */
        .fallback-link {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            margin-top: 16px;
            word-break: break-all;
        }
        .fallback-link a {
            color: #059669;
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background: #f8fafc;
            padding: 28px 32px 32px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .footer-brand {
            font-weight: 800;
            color: #0f172a;
            font-size: 15px;
            margin: 0 0 4px;
        }
        .footer-tagline {
            color: #64748b;
            font-size: 13px;
            margin: 0 0 18px;
        }
        .footer-support {
            color: #94a3b8;
            font-size: 12px;
            margin: 0;
        }
        .footer-support a {
            color: #059669;
            font-weight: 600;
        }
        .footer-copyright {
            color: #cbd5e1;
            font-size: 11px;
            margin: 14px 0 0;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .wrapper { padding: 16px 8px 24px; }
            .container { border-radius: 18px; }
            .header { padding: 28px 20px 22px; }
            .header-title { font-size: 22px; }
            .content { padding: 28px 22px 8px; }
            .content h2 { font-size: 20px; }
            .footer { padding: 22px 20px 26px; }
            .button { padding: 14px 28px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <span class="header-dot"></span>
                <h1 class="header-title">Eagles &amp; Eaglets</h1>
                <p class="header-tagline">Mentorship Platform</p>
            </div>

            <div class="content">
                {% block content %}{% endblock %}
            </div>

            <div class="footer">
                <p class="footer-brand">Eagles &amp; Eaglets</p>
                <p class="footer-tagline">Building the next generation of leaders</p>
                <p class="footer-support">
                    Questions? Reach us at
                    <a href="mailto:{{ support_email }}">{{ support_email }}</a>
                </p>
                <p class="footer-copyright">
                    &copy; {% now "Y" %} Eagles &amp; Eaglets. All rights reserved.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
